name: Refresh and deploy ArchAtlas

on:
  push:
    branches: [master]
  schedule:
    # 08:30 Asia/Shanghai (UTC+8); GitHub may delay scheduled jobs under load.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Hugging Face catalog
        run: python .github/archatlas-source/scripts/daily_refresh.py
      - name: Test API and static export
        working-directory: .github/archatlas-source
        run: python -m unittest discover -s tests -v
      - name: Test local interview index collector
        run: python -m unittest discover -s tests/xhs-collector -v
      - name: Build ArchAtlas for the website root
        run: |
          python .github/archatlas-source/scripts/build_pages.py --output public
          # Preserve the independent interview index when the root snapshot is replaced.
          mkdir -p public/interview-questions
          rsync -a interview-questions/ public/interview-questions/
      - name: Replace the website root with ArchAtlas
        run: |
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' --exclude='/public/' public/ ./
          printf '/public/\n' >> .git/info/exclude
      - name: Commit refreshed snapshot and root website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot has no changes; nothing to commit."
          else
            git commit -m "chore: refresh and deploy ArchAtlas at site root"
            git push
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
