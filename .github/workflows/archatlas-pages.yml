name: Refresh and deploy ArchAtlas

on:
  push:
    branches: [master]
  schedule:
    # 08:30 Asia/Shanghai (UTC+8); GitHub may delay scheduled jobs under load.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Hugging Face catalog
        run: python .github/archatlas-source/scripts/daily_refresh.py
      - name: Test API and static export
        working-directory: .github/archatlas-source
        run: python -m unittest discover -s tests -v
      - name: Build ArchAtlas static app
        run: python .github/archatlas-source/scripts/build_pages.py --output archatlas
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/archatlas-source/data archatlas
          if git diff --cached --quiet; then
            echo "Snapshot has no changes; nothing to commit."
          else
            git commit -m "chore: refresh ArchAtlas model snapshot"
            git push
          fi
      - name: Assemble the existing website plus ArchAtlas
        run: |
          rm -rf public
          mkdir -p public
          shopt -s dotglob
          for path in *; do
            case "$path" in
              .git|.github|public) continue ;;
            esac
            cp -a "$path" public/
          done
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
