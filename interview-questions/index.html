<body>
  <div class="page-shell">

      <a class="brand" href="/" aria-label="返回 ArchAtlas"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span><b>archatlas</b><small>AI INFRA INTERVIEW INDEX</small></span></a>
      <nav><a href="/">模型架构图谱</a><span class="divider">/</span><span>面试题库</span></nav>
